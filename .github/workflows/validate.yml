name: Validate manuscript

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-checks:
    name: Finite checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: make check

  manuscript:
    name: Build manuscript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk \
            texlive-latex-extra texlive-fonts-extra texlive-fonts-extra-links \
            texlive-fonts-recommended tex-gyre texlive-science texlive-plain-generic
      - name: Build PDF with failure diagnostics
        run: |
          make pdf || { cat main.log; exit 1; }
          make sat-note || { cat output/pdf/sat-note.log; exit 1; }
      - name: Check references and typography
        run: |
          if grep -E '(^!|LaTeX Warning:|Package .* Warning:|Overfull|Underfull)' main.log output/pdf/sat-note.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: understanding-nondeterminism-paper
          path: |
            main.pdf
            output/pdf/sat-note.pdf
          if-no-files-found: error
